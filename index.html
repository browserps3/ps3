<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS3 Browser Homepage</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #000000;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ffffff;
      font-size: 36px;
      margin-top: 30px;
      margin-bottom: 10px;
    }
    h2 {
      color: #aaaaaa;
      font-size: 22px;
      margin-top: 5px;
      margin-bottom: 30px;
    }
    .links {
      width: 80%;
      margin: 0 auto;
    }
    .link-box {
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 8px;
      padding: 15px;
      margin: 12px auto;
      max-width: 500px;
    }
    .link-box a {
      color: #00aaff;
      font-size: 26px;
      text-decoration: none;
      display: block;
      padding: 10px;
    }
    .link-box a:hover {
      color: #ffffff;
    }
    .link-box p {
      color: #888888;
      font-size: 16px;
      margin: 5px 0 0 0;
    }
    .footer {
      color: #555555;
      font-size: 14px;
      margin-top: 40px;
    }
    .search-box {
      margin: 20px auto;
      max-width: 500px;
    }
    .search-box input {
      width: 70%;
      padding: 12px;
      font-size: 20px;
      border: 2px solid #333333;
      background-color: #111111;
      color: #ffffff;
      border-radius: 6px;
    }
    .search-box button {
      padding: 12px 20px;
      font-size: 20px;
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>PS3 Browser</h1>
  <h2>Homepage</h2>

  <div class="search-box">
    <form action="https://www.google.com/search" method="get">
      <input type="text" name="q" placeholder="Search Google...">
      <button type="submit">Go</button>
    </form>
  </div>

  <div class="links">
    <div class="link-box">
      <a href="https://www.google.com">Google</a>
      <p>Search engine</p>
    </div>
    <div class="link-box">
      <a href="https://www.youtube.com">YouTube</a>
      <p>Watch videos</p>
    </div>
    <div class="link-box">
      <a href="https://www.wikipedia.org">Wikipedia</a>
      <p>Encyclopedia</p>
    </div>
    <div class="link-box">
      <a href="https://www.reddit.com">Reddit</a>
      <p>Forum &amp; news</p>
    </div>
    <div class="link-box">
      <a href="https://www.bing.com">Bing</a>
      <p>Search engine</p>
    </div>
    <div class="link-box">
      <a href="https://news.google.com">Google News</a>
      <p>Latest news</p>
    </div>
  </div>

  <div class="footer">
    <p>Made for PS3 Browser &middot; Hosted on Cloudflare</p>
  </div>
</body>
</html>
